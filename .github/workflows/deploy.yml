name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Verify the Cloudflare API token is valid and has sufficient permissions
      # before running the full build + deploy.
      #
      # Required API token permissions:
      #   Account > Workers Scripts > Edit
      #   Zone    > Workers Routes  > Edit   (needed for custom_domain routes)
      #   Zone    > Zone            > Read   (needed to look up the zone)
      #
      # To create or update the token:
      #   https://dash.cloudflare.com/profile/api-tokens
      # Then store the value in the repository secret CLOUDFLARE_API_TOKEN
      # (Settings > Secrets and variables > Actions).
      - name: Verify Cloudflare credentials
        run: npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
